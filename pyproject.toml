[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-navidrome-now-playing"
version = "1.0.0"
description = "Push-based read-only Navidrome now-playing media player for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "simplyRoba" }]
dependencies = []

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-homeassistant-custom-component",
  "ruff>=0.9"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "navidrome-plugin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.navidrome_nowplaying"]
